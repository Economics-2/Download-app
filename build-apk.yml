name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoDownloader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-apk
          path: VideoDownloader.apk

      # ফোনের ব্রাউজার থেকে সরাসরি ডাউনলোডের জন্য Releases পেজে "latest" নামে প্রকাশ হবে
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          body: "সর্বশেষ বিল্ড। VideoDownloader.apk ডাউনলোড করে ইনস্টল করুন।"
          files: VideoDownloader.apk
          make_latest: true
